name: Generate Snake Animation

on:
  schedule:
    # Runs automatically at midnight every day
    - cron: "0 0 * * *" 
  workflow_dispatch:
  push:
    branches:
    - main # Note: Change to 'master' if your default branch is master

# REQUIRED: Grants the action permission to push to the output branch
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          # Hardcoded to your exact GitHub username
          github_user_name: Yash-Padme
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}